# systemd drop-in override that adds robust auto-restart to the existing
# orderbook-recorder service WITHOUT touching its working ExecStart.
#
# Install on the VM:
#   sudo systemctl edit orderbook-recorder
# then paste the [Unit]/[Service] blocks below, OR:
#   sudo mkdir -p /etc/systemd/system/orderbook-recorder.service.d
#   sudo cp scripts/orderbook-recorder.override.conf \
#       /etc/systemd/system/orderbook-recorder.service.d/override.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart orderbook-recorder
#
# With the code changes, the recorder now EXITS non-zero on a fatal background
# failure (writer crash / backpressure), so Restart=always actually kicks in
# and the recorder rebuilds the orderbook via its sync-recovery loop.
# StartLimit prevents an endless crash-loop (e.g. if the disk is still full).

[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Restart=always
RestartSec=10
